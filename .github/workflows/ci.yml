name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # Core checks need no npm install, optional browser peers or model weights.
      - name: Test SDK and CLI
        run: npm test
      - name: Verify reviewed catalog
        run: npm run verify
      - name: Install only the pinned optional renderer peer
        run: |
          npm install --prefix .cache/renderer-peer --ignore-scripts --no-save --package-lock=false three@0.186.1
          mkdir -p node_modules
          ln -s ../.cache/renderer-peer/node_modules/three node_modules/three
      - name: Test reusable 3D renderer
        run: node --test test/scene-3d.test.mjs
      - name: Validate example recipes
        run: |
          for manifest in examples/*.agent.json; do
            node scripts/verify.mjs "$manifest"
          done
      - name: Scaffold and validate a recipe
        run: |
          npm run create -- ci-recipe --template story-seed
          node scripts/verify.mjs agents/ci-recipe/agent.json
